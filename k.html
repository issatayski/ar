<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корсет — 3D модель (вариант 1)</title>
<style>
  :root{
    --ink:#0b2447;
    --muted:#5b6b86;
    --panel:rgba(255,255,255,0.82);
    --accent:#1d4ed8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 120% at 50% 0%, #eaf2fc 0%, #dce9f8 45%, #cfe0f4 100%);
    overflow:hidden;
  }
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .hud{
    position:fixed;left:22px;top:20px;
    background:var(--panel);
    backdrop-filter:blur(6px);
    border:1px solid rgba(29,78,216,0.18);
    border-radius:14px;
    padding:16px 18px;
    max-width:330px;
    box-shadow:0 10px 30px rgba(11,36,71,0.12);
  }
  .hud h1{
    margin:0 0 4px;
    font-size:19px;
    letter-spacing:-0.01em;
  }
  .hud .sub{
    margin:0 0 12px;
    font-size:14px;
    color:var(--muted);
    line-height:1.45;
  }
  .row{display:flex;align-items:center;gap:9px;font-size:14px;margin-top:8px;}
  .row input{width:17px;height:17px;accent-color:var(--accent);}
  .hint{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    font-size:13px;color:var(--muted);
    background:var(--panel);
    border:1px solid rgba(29,78,216,0.14);
    padding:7px 14px;border-radius:999px;
    box-shadow:0 6px 18px rgba(11,36,71,0.1);
  }
  .tag{
    display:inline-block;font-size:12px;font-weight:600;
    color:var(--accent);background:rgba(29,78,216,0.1);
    padding:2px 9px;border-radius:999px;margin-bottom:10px;
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <span class="tag">Этап 1 · форма корсета</span>
  <h1>Корсет для спины</h1>
  <p class="sub">Синий полупрозрачный пластик, лёгкий и эластичный. Модель медленно вращается — рассмотрите со всех сторон.</p>
  <label class="row"><input type="checkbox" id="toggleBody"> Показать контур тела</label>
  <label class="row"><input type="checkbox" id="toggleSpin" checked> Автоповорот</label>
</div>

<div class="hint">Перетащите мышью, чтобы повернуть · колесо — приблизить</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const app = document.getElementById('app');

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

// ---------- scene & camera ----------
const scene = new THREE.Scene();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0.9, 1.05, 2.35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.78, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 5;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;

// ---------- lights ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(2.5, 4, 3);
scene.add(key);
const rim = new THREE.DirectionalLight(0xbcd4ff, 1.1);
rim.position.set(-3, 2, -2.5);
scene.add(rim);

// ---------- torso cross-section (radii by height) ----------
const RX = [[-0.25,0.40],[0.0,0.40],[0.6,0.44],[1.2,0.47],[1.5,0.52],[1.62,0.50]];
const RZ = [[-0.25,0.24],[0.0,0.24],[0.6,0.26],[1.2,0.285],[1.5,0.27],[1.62,0.25]];
function interp(tbl, y){
  if (y <= tbl[0][0]) return tbl[0][1];
  if (y >= tbl[tbl.length-1][0]) return tbl[tbl.length-1][1];
  for (let i=0;i<tbl.length-1;i++){
    const [y0,v0]=tbl[i], [y1,v1]=tbl[i+1];
    if (y>=y0 && y<=y1){ const f=(y-y0)/(y1-y0); return v0+(v1-v0)*f; }
  }
  return tbl[tbl.length-1][1];
}
const rx = y => interp(RX, y);
const rz = y => interp(RZ, y);

// position on torso surface at angle t (t=0 front +Z, t=PI back -Z) and height y, pushed out by off
function surf(t, y, off){
  const RXo = rx(y)+off, RZo = rz(y)+off;
  return new THREE.Vector3(RXo*Math.sin(t), y, RZo*Math.cos(t));
}

// ---------- build a curved panel (sheet wrapping the torso) ----------
function panel(tA, tB, yA, yB, tSeg, ySeg, off){
  const g = new THREE.BufferGeometry();
  const pos=[], idx=[];
  for(let i=0;i<=ySeg;i++){
    const y = yA + (yB-yA)*(i/ySeg);
    for(let j=0;j<=tSeg;j++){
      const t = tA + (tB-tA)*(j/tSeg);
      const p = surf(t, y, off);
      pos.push(p.x, p.y, p.z);
    }
  }
  const row = tSeg+1;
  for(let i=0;i<ySeg;i++){
    for(let j=0;j<tSeg;j++){
      const a=i*row+j, b=a+1, c=a+row, d=c+1;
      idx.push(a,c,b, b,c,d);
    }
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// ---------- materials ----------
const plastic = new THREE.MeshPhysicalMaterial({
  color: 0x2563eb,
  metalness: 0.0,
  roughness: 0.18,
  transmission: 0.55,
  thickness: 0.45,
  ior: 1.45,
  clearcoat: 0.7,
  clearcoatRoughness: 0.2,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.92,
});
const ribMat = new THREE.MeshPhysicalMaterial({
  color: 0x1e3a8a,
  metalness: 0.05,
  roughness: 0.3,
  transmission: 0.18,
  thickness: 0.3,
  ior: 1.45,
  clearcoat: 0.6,
  side: THREE.DoubleSide,
});
const strapMat = new THREE.MeshPhysicalMaterial({
  color: 0x2f6bff,
  roughness: 0.35,
  transmission: 0.25,
  thickness: 0.2,
  clearcoat: 0.5,
});

const corset = new THREE.Group();

// back panel (shoulders -> lower back, wraps the back & sides)
corset.add(new THREE.Mesh(panel(Math.PI-1.05, Math.PI+1.05, 0.34, 1.46, 64, 40, 0.012), plastic));

// lumbar belt (wraps almost all the way, small gap at front)
corset.add(new THREE.Mesh(panel(0.20, 2*Math.PI-0.20, -0.16, 0.40, 96, 18, 0.020), plastic));

// vertical stays / ribs along the spine
const stayCenters = [Math.PI-0.5, Math.PI-0.17, Math.PI+0.17, Math.PI+0.5];
stayCenters.forEach(c=>{
  corset.add(new THREE.Mesh(panel(c-0.05, c+0.05, 0.40, 1.40, 6, 30, 0.030), ribMat));
});

// shoulder straps (over each shoulder, back -> front -> belt)
function strap(sign){
  const pts = [
    new THREE.Vector3(sign*0.20, 1.30, -0.27),
    new THREE.Vector3(sign*0.24, 1.58, -0.05),
    new THREE.Vector3(sign*0.21, 1.55,  0.18),
    new THREE.Vector3(sign*0.13, 1.10,  0.31),
    new THREE.Vector3(sign*0.10, 0.46,  0.30),
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 80, 0.030, 14, false);
  return new THREE.Mesh(geo, strapMat);
}
corset.add(strap(1));
corset.add(strap(-1));

scene.add(corset);

// ---------- faint body contour (toggle) ----------
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0x8aa0bd, roughness:0.9, transparent:true, opacity:0.10, depthWrite:false,
});
const bodyMesh = new THREE.Mesh(panel(0, 2*Math.PI, -0.25, 1.62, 80, 40, 0.0), bodyMat);
bodyMesh.visible = false;
scene.add(bodyMesh);

// ---------- soft contact shadow ----------
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = shadowCanvas.height = 256;
const sctx = shadowCanvas.getContext('2d');
const grd = sctx.createRadialGradient(128,128,10,128,128,128);
grd.addColorStop(0,'rgba(11,36,71,0.33)');
grd.addColorStop(1,'rgba(11,36,71,0)');
sctx.fillStyle=grd; sctx.fillRect(0,0,256,256);
const shadowTex = new THREE.CanvasTexture(shadowCanvas);
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(1.7,1.2),
  new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, depthWrite:false})
);
shadow.rotation.x = -Math.PI/2;
shadow.position.y = -0.27;
scene.add(shadow);

// ---------- UI ----------
document.getElementById('toggleBody').addEventListener('change', e=>{
  bodyMesh.visible = e.target.checked;
});
document.getElementById('toggleSpin').addEventListener('change', e=>{
  controls.autoRotate = e.target.checked;
});

// ---------- loop ----------
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

renderer.setAnimationLoop(()=>{
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
